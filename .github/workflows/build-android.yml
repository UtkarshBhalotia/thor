name: Build Android

# Trigger this workflow manually or on version tags
on:
  push:
    branches:
      - CI_CD_Integration_Testing
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug/release)'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release

jobs:
  build-android:
    name: Build Android APK/AAB
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      # Step 3: Set up Java (required for Android builds)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      # Step 4: Install Node dependencies
      - name: Install dependencies
        run: npm ci
      
      # Step 5: Cache Gradle dependencies
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      # Step 6: Make gradlew executable
      - name: Make gradlew executable
        run: chmod +x android/gradlew
      
      # Step 7: Set up release keystore (Not needed since ro.jks is committed)
      # - name: Set up release keystore
      #   if: github.event.inputs.build_type == 'release' || startsWith(github.ref, 'refs/tags/')
      #   run: |
      #     echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
      #   continue-on-error: false

      # Step 7.1: Auto-increment Version Code
      - name: Auto-increment Version Code
        if: github.event.inputs.build_type == 'release' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/CI_CD_Integration_Testing')
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          echo "Updated versionCode to ${{ github.run_number }}"
      
      # Step 8: Build Debug APK (default)
      # - name: Build Debug APK
      #   if: github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == ''
      #   run: |
      #     cd android
      #     ./gradlew assembleDebug --no-daemon
      
      # Step 9: Build Release APK & AAB
      - name: Build Release APK & AAB
        if: |
          github.event.inputs.build_type == 'release' || 
          startsWith(github.ref, 'refs/tags/') || 
          (github.event_name == 'push' && github.ref == 'refs/heads/CI_CD_Integration_Testing')
        run: |
          cd android
          ./gradlew clean
          ./gradlew assembleRelease bundleRelease --no-daemon
      
      # Step 11: Upload Debug APK as artifact
      # - name: Upload Debug APK
      #   if: github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == ''
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: app-debug
      #     path: android/app/build/outputs/apk/debug/app-debug.apk
      #     retention-days: 30
      
      # Step 12: Upload Release APK as artifact
      - name: Upload Release APK
        if: |
          github.event.inputs.build_type == 'release' || 
          startsWith(github.ref, 'refs/tags/') || 
          (github.event_name == 'push' && github.ref == 'refs/heads/CI_CD_Integration_Testing')
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      # Step 13: Send Email with Download Link
      - name: Send Email
        if: |
          github.event.inputs.build_type == 'release' || 
          startsWith(github.ref, 'refs/tags/') || 
          (github.event_name == 'push' && github.ref == 'refs/heads/CI_CD_Integration_Testing')
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "New Android Build: Release APK Available"
          to: utkarsh.bhalotia@busy.in
          from: GitHub Actions
          body: |
            The build for ${{ github.repository }} has completed successfully.
            
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            
            You can download the APK from the GitHub Actions run page:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            (Note: You must be logged into GitHub to download the artifact.)
          # attachments: android/app/build/outputs/apk/release/app-release.apk

      # Step 14: Notify Google Chat with Download Link
      - name: Notify Google Chat
        if: |
          github.event.inputs.build_type == 'release' || 
          startsWith(github.ref, 'refs/tags/') || 
          (github.event_name == 'push' && github.ref == 'refs/heads/CI_CD_Integration_Testing')
        run: |
          curl -X POST -H 'Content-Type: application/json' \
          '${{ secrets.GOOGLE_CHAT_WEBHOOK }}' \
          -d '{"text": "🚀 *New Android Build Successful!*\n*Project:* ${{ github.repository }}\n*Branch:* ${{ github.ref_name }}\n*Build Type:* Release APK\n*Download Link:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n*Notify:* utkarsh.bhalotia@busy.in"}'
      
      # Step 15: Upload to Play Store (Internal Track)
      - name: Upload to Play Store
        if: |
          github.event.inputs.build_type == 'release' || 
          startsWith(github.ref, 'refs/tags/') || 
          (github.event_name == 'push' && github.ref == 'refs/heads/CI_CD_Integration_Testing')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.roservice.partner
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
